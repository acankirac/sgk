# /etc/nginx/sites-available/cift-aylik
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/cift-aylik;
    index index.html;
    charset utf-8;

    # Uygulama dosyaları
    location / {
        try_files $uri $uri/ =404;
    }

    # Service worker ve manifest her zaman taze
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(woff2|png|svg)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
}
